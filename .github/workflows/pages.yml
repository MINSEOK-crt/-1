name: Deploy inspection workspace to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version browser assets
        run: |
          sed -i -e "s|./styles\.css\"|./styles.css?v=${GITHUB_SHA}\"|" \
                 -e "s|./app\.js\"|./app.js?v=${GITHUB_SHA}\"|" dist/index.html
          sed -i -e "s|./defect-guide\.mjs'|./defect-guide.mjs?v=${GITHUB_SHA}'|" \
                 -e "s|./gemini-client\.mjs'|./gemini-client.mjs?v=${GITHUB_SHA}'|" dist/app.js
          sed -i -e "s|./defect-guide\.mjs'|./defect-guide.mjs?v=${GITHUB_SHA}'|" \
                 -e "s|./gemini-api\.mjs'|./gemini-api.mjs?v=${GITHUB_SHA}'|" dist/gemini-client.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
